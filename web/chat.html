<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeaWindow 智能问答</title>
<style>
  :root{--bg:#0b1219;--panel:#16212b;--fg:#e8eef3;--muted:#8aa0b2;--line:#243444;--accent:#4aa8ff;--green:#3fb950;--red:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0c141b,#0f1720);color:var(--fg);
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  h1{margin:0;font-size:18px} h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12px;margin-top:4px}
  #log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.55}
  .me{align-self:flex-end;background:#1f6feb;color:#fff}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .meta{color:var(--muted);font-size:11px;margin-top:6px}
  .chain{color:var(--green);font-size:11px;margin-top:4px}
  .typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:6px 10px}
  .err{border-color:var(--red)}
  .retry{background:none;border:1px solid var(--line);color:var(--accent);border-radius:8px;font-size:11px;padding:3px 10px;margin-top:6px;cursor:pointer;height:auto}
  .chips{padding:0 18px 8px}
  .chip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;
         padding:5px 12px;font-size:12px;color:#bcd0de;margin:3px 6px 3px 0;cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--accent)}
  #bar{display:flex;gap:8px;padding:10px 18px 4px;border-top:1px solid var(--line);align-items:center}
  #q{flex:1;background:#0f1a24;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);font-size:14px}
  #send{background:var(--accent);border:0;border-radius:10px;padding:0 18px;height:44px;color:#06121d;font-weight:700;cursor:pointer}
  #send[disabled]{opacity:.55;cursor:not-allowed}
  #clear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;height:34px;padding:0 12px;cursor:pointer;font-size:12px}
  .opt{padding:2px 18px 12px;color:var(--muted);font-size:12px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (max-width:380px){
    header{padding:10px 12px}
    h1{font-size:15px}
    .hide-narrow{display:none}
    .sub{display:none}
    #clear{font-size:0;padding:0 10px}
    #clear::after{content:"\1F9F9";font-size:16px}
    .chips{padding:0 12px 6px}
    #bar{padding:8px 12px 4px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>梅坞采候 <span>TeaWindow</span><span class="hide-narrow"> · 智能问答</span></h1>
    <div class="sub">由 <b>TeaWindow 自研引擎</b>驱动（意图识别 → 调用本项目数据与模型 → 接地生成）；可选 DeepSeek 增强</div>
  </div>
  <button id="clear" type="button">清空对话</button>
</header>
<div id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="对话记录"></div>
<div class="chips" id="chips" aria-label="快捷问题"></div>
<form id="bar" autocomplete="off">
  <label class="sr-only" for="q">请输入你的问题</label>
  <input id="q" name="q" placeholder="输入你的问题…" aria-describedby="hint">
  <button id="send" type="submit">发送</button>
</form>
<div class="opt">
  <label id="hint"><input type="checkbox" id="enh"> 使用 DeepSeek 增强（仅表述，不作为智力来源）</label>
</div>
<div class="opt" style="opacity:.8">
  <span>🔒 隐私：对话仅保存在你的浏览器本地；不同用户互不可见。为改进服务，系统会**匿名**记录问题与答案（不含 IP 与身份），仅用于本项目问答的纠偏与训练。</span>
</div>
<script src="chat.js"></script>
</body>
</html>
