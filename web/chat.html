<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeaWindow 智能问答</title>
<style>
  :root{--bg:#0b1219;--panel:#16212b;--fg:#e8eef3;--muted:#8aa0b2;--line:#243444;--accent:#4aa8ff}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0c141b,#0f1720);color:var(--fg);
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:16px 20px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px} h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12px;margin-top:4px}
  #log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.5}
  .me{align-self:flex-end;background:#1f6feb;color:#fff}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .src{color:var(--muted);font-size:11px;margin-top:4px}
  .chips{padding:0 18px 8px}
  .chip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;
         padding:5px 12px;font-size:12px;color:#bcd0de;margin:3px 6px 3px 0;cursor:pointer}
  #bar{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
  #q{flex:1;background:#0f1a24;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);font-size:14px}
  button{background:var(--accent);border:0;border-radius:10px;padding:0 18px;color:#06121d;font-weight:700;cursor:pointer}
  .note{color:var(--muted);font-size:11px;padding:0 18px 10px}
</style>
</head>
<body>
<header>
  <h1>梅坞采候 <span>TeaWindow</span> · 智能问答</h1>
  <div class="sub">向我提问（例：明天该采哪块地？要不要防冻？）· 由 DeepSeek 驱动，仅依据实时数据回答</div>
</header>
<div id="log"></div>
<div class="chips" id="chips"></div>
<div id="bar"><input id="q" placeholder="输入你的问题…"><button id="send">发送</button></div>
<div class="note" id="note"></div>

<script>
const $ = s => document.querySelector(s);
const log = $("#log");
function add(text, cls, src){
  const d = document.createElement("div"); d.className = "msg " + cls;
  d.textContent = text;
  if (src){ const s=document.createElement("div"); s.className="src"; s.textContent = "来源：" + src; d.appendChild(s); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
const suggestions = ["明天该采哪块地？","未来三天有霜冻风险吗？","要不要现在灌溉？","这次高温会影响来年春茶吗？"];
$("#chips").innerHTML = suggestions.map(t=>`<span class="chip">${t}</span>`).join("");
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ $("#q").value=c.textContent; send(); });

async function send(){
  const q = $("#q").value.trim(); if(!q) return;
  add(q, "me"); $("#q").value = "";
  try {
    const r = await fetch("api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question:q})});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json(); add(d.text, "bot", d.source);
  } catch(e){
    add("（离线或服务不可用）请通过在线服务访问本页；离线可查看仪表盘预报表的建议。", "bot", "fallback");
  }
}
$("#send").onclick = send;
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });
$("#note").textContent = "提示：本页需连接后端服务（在线模式）；离线时请使用仪表盘 / index.html。";
</script>
</body>
</html>
