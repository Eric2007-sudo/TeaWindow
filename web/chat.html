<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeaWindow 智能问答</title>
<style>
  :root{--bg:#0b1219;--panel:#16212b;--fg:#e8eef3;--muted:#8aa0b2;--line:#243444;--accent:#4aa8ff;--green:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0c141b,#0f1720);color:var(--fg);
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px} h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12px;margin-top:4px}
  #log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.55}
  .me{align-self:flex-end;background:#1f6feb;color:#fff}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .meta{color:var(--muted);font-size:11px;margin-top:6px}
  .chain{color:var(--green);font-size:11px;margin-top:4px}
  .chips{padding:0 18px 8px}
  .chip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:999px;
         padding:5px 12px;font-size:12px;color:#bcd0de;margin:3px 6px 3px 0;cursor:pointer}
  #bar{display:flex;gap:8px;padding:10px 18px 4px;border-top:1px solid var(--line);align-items:center}
  #q{flex:1;background:#0f1a24;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);font-size:14px}
  button{background:var(--accent);border:0;border-radius:10px;padding:0 18px;height:44px;color:#06121d;font-weight:700;cursor:pointer}
  .opt{padding:0 18px 12px;color:var(--muted);font-size:12px}
  label{user-select:none}
</style>
</head>
<body>
<header>
  <h1>梅坞采候 <span>TeaWindow</span> · 智能问答</h1>
  <div class="sub">由 <b>TeaWindow 自研引擎</b>驱动（意图识别 → 调用本项目数据与模型 → 接地生成）；可选 DeepSeek 增强</div>
</header>
<div id="log"></div>
<div class="chips" id="chips"></div>
<div id="bar"><input id="q" placeholder="输入你的问题…"><button id="send">发送</button></div>
<div class="opt"><label><input type="checkbox" id="enh"> 使用 DeepSeek 增强（仅表述，不作为智力来源）</label></div>

<script>
const $ = s => document.querySelector(s);
const log = $("#log");
function add(text, cls, meta, chain){
  const d = document.createElement("div"); d.className = "msg " + cls;
  d.appendChild(document.createTextNode(text));
  if (meta){ const m=document.createElement("div"); m.className="meta"; m.textContent = meta; d.appendChild(m); }
  if (chain) { const c=document.createElement("div"); c.className="chain"; c.textContent = "来源链：" + chain.join(" → "); d.appendChild(c); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
const suggestions = ["今天有风险吗？","要不要防冻？","先采哪块地？","保险多少钱一亩？","今年什么时候开采？","你们用什么模型？"];
$("#chips").innerHTML = suggestions.map(t=>`<span class="chip">${t}</span>`).join("");
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ $("#q").value=c.textContent; send(); });

async function send(){
  const q = $("#q").value.trim(); if(!q) return;
  add(q, "me"); $("#q").value = "";
  const engine = $("#enh").checked ? "llm" : "own";
  try {
    const r = await fetch("api/ask", {method:"POST", headers:{"Content-Type":"application/json"},
                                      body: JSON.stringify({question:q, engine})});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const label = d.engine === "deepseek-chat" ? "引擎：DeepSeek 增强" : "引擎：TeaWindow 自研";
    const meta = label + (d.intent ? `　意图：${d.intent}（置信 ${d.confidence}）` : "");
    add(d.text, "bot", meta, d.chain);
  } catch(e){
    add("（离线或服务不可用）请通过在线服务访问本页：https://teawindow.onrender.com/chat.html", "bot", "离线降级");
  }
}
$("#send").onclick = send;
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });
</script>
</body>
</html>
