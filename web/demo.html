<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeaWindow 自播放演示（录屏用）</title>
<style>
  :root{--bg:#0b1219;--fg:#e8eef3;--muted:#8aa0b2;--accent:#4aa8ff;--line:#243444}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;height:4px;background:var(--accent);width:0;z-index:9;transition:width .2s}
  #stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 5vw 12vh}
  h1{font-size:clamp(22px,3.4vw,40px);margin:0 0 1.2vh;text-align:center}
  .cap{color:var(--muted);font-size:clamp(13px,1.6vw,19px);margin-top:1.4vh;text-align:center;max-width:80ch}
  img{max-width:88vw;max-height:66vh;border-radius:12px;border:1px solid var(--line);object-fit:contain;background:#0f1a24}
  .hero{text-align:center}
  .hero .big{font-size:clamp(30px,6vw,72px);font-weight:800;letter-spacing:1px}
  .hero .sub{color:var(--muted);margin-top:10px;font-size:clamp(14px,2vw,22px)}
  .kpi{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .kpi span{background:#16212b;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:#bcd0de;font-size:clamp(12px,1.5vw,16px)}
  #hud{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}
  #hud b{color:#cfe0ee}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="hud">空格：暂停/继续　← →：上一页/下一页　|　TeaWindow 自播放演示</div>
<script src="data.js"></script>
<script src="demo.js"></script>
</body>
</html>
