<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeaWindow · 地块级地形风险图（梅家坞）</title>
<style>
  :root{--bg:#0b1219;--panel:#16212b;--fg:#e8eef3;--muted:#8aa0b2;--line:#243444;--accent:#4aa8ff}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0c141b,#0f1720);color:var(--fg);
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:22px;margin:0 0 4px} h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  button{font:inherit;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#0f1a24;color:var(--fg);cursor:pointer}
  button.on{background:#12324a;border-color:#1d4a6b;color:#cfe0ee}
  .grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .map{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;cursor:crosshair}
  .map img.ph{display:block;width:100%}
  .map img.lyr{position:absolute;inset:0;width:100%;display:none}
  .map canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #tip{position:absolute;pointer-events:none;background:rgba(11,18,25,.94);border:1px solid var(--line);
       border-radius:8px;padding:6px 9px;font-size:12.5px;line-height:1.5;color:#dfe9f2;transform:translate(8px,-8px);display:none;z-index:5}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .lg{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .sw{width:18px;height:10px;border-radius:3px;display:inline-block;vertical-align:middle}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
  tr.click{cursor:pointer} tr.click:hover{background:#12202b}
  .hi{color:#e5534b} .mid{color:#d6b657} .lo{color:#3fb950}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>梅坞采候 <span>TeaWindow</span> · 地块级地形风险图</h1>
  <div class="sub">梅家坞茶园 AOI · DEM 山体阴影 + 逐格点风险下推（海拔递减 + 冷池/坡向）· 点击地块自动生成数据并可提问</div>

  <div class="bar">
    <button id="bRisk" class="on">综合风险（实时）</button>
    <button id="bFrost">霜冻</button>
    <button id="bHeat">高温</button>
    <button id="bDrought">干旱</button>
    <button id="bHill">仅地形</button>
    <button id="bParcel" class="on">地块边界(OSM)</button>
    <span class="lg"><span class="sw" style="background:#3fb950"></span> 低
      <span class="sw" style="background:#d6b657"></span> 中
      <span class="sw" style="background:#e5534b"></span> 高/极高</span>
    <span style="flex:1"></span>
    <a href="chat.html">智能问答</a> <a href="index.html">← 返回仪表盘</a>
  </div>

  <div class="grid">
    <div class="map" id="map">
      <img class="ph" src="terrain_hillshade.png" alt="地形底图">
      <img id="lyr" class="lyr" src="terrain_frost.png" alt="叠加层">
      <canvas id="cv"></canvas>
      <div id="tip"></div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:6px" id="toptitle">本日高风险地块（实时下推）</div>
      <table id="top"><thead><tr><th>位置(经纬)</th><th>海拔</th><th>R</th><th>等级</th></tr></thead><tbody></tbody></table>
      <div class="lg" id="base">加载中…</div>
      <div class="lg" id="stations"></div>
      <div class="lg" id="method"></div>
      <div class="lg">提示：地图上<b>点击任意位置</b>会自动生成该点数据（海拔/坡度/坡向 + 下推天气 + 风险 R + 建议）。</div>
      <div class="card" id="plotCard" style="margin-top:10px;display:none"></div>
    </div>
  </div>
</div>
<script src="terrain.js"></script>
</body>
</html>
