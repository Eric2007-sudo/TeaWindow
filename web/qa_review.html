<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeaWindow 问答审阅（管理员）</title>
<style>
  :root{--bg:#0b1219;--panel:#16212b;--fg:#e8eef3;--muted:#8aa0b2;--line:#243444;--accent:#4aa8ff;--ok:#3fb950;--bad:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0c141b,#0f1720);color:var(--fg);
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:20px;margin:0 0 4px} h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input,button{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0f1a24;color:var(--fg)}
  button{cursor:pointer} button.p{background:#12324a;border-color:#1d4a6b}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .q{font-weight:600} .meta{color:var(--muted);font-size:12px;margin:4px 0}
  .a{color:#cfe0ee;font-size:13px;white-space:pre-wrap}
  .act{display:flex;gap:8px;margin-top:8px}
  .ev{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .ev summary{cursor:pointer;color:var(--muted);font-size:12px}
  .ev .a{font-size:12px;margin-top:6px}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1>梅坞采候 <span>TeaWindow</span> · 问答审阅（管理员）</h1>
  <div class="sub">匿名问答（不含 IP/身份）。标记"相关/不相关"与教师参考，形成"使用→纠偏→回训"闭环。</div>
  <div class="bar">
    <input id="tok" type="password" placeholder="X-Admin-Token" style="min-width:260px">
    <button class="p" id="load">加载</button>
    <span id="cnt" class="meta"></span>
    <span class="meta">仅管理员可见；数据为匿名记录。</span>
  </div>
  <div id="list"></div>
</div>
<script src="qa_review.js"></script>
</body>
</html>
