name: Frequent refresh (external cron)

# 解决 Render 免费层休眠导致内置 apscheduler 不触发的问题：
# 由 GitHub Actions 每 15 分钟调用线上 /api/refresh（轻量：仅预报），并顺带保活。
# 注：GitHub 会对高频 schedule 延迟/节流；若要稳定的 10 分钟级，请用外部 pinger（如 cron-job.org）打 /api/refresh。
on:
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分钟（UTC）；GitHub 会对更频繁的 schedule 节流，故取 15 分钟
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh & keep-alive
        run: |
          echo "== wake up / health =="
          curl -sS -m 120 --retry 3 --retry-delay 15 --retry-all-errors \
               "https://teawindow.onrender.com/api/health" || true
          echo ""
          echo "== light refresh (forecast-only) =="
          curl -sS -m 300 --retry 4 --retry-delay 30 --retry-all-errors -X POST \
               "https://teawindow.onrender.com/api/refresh?fetch=true" \
               -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" || true
          echo ""
          echo "== ready (refresh/last_success) =="
          curl -sS -m 120 "https://teawindow.onrender.com/api/ready" || true
