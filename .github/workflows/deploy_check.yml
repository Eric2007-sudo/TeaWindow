name: Deploy check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Consistency self-check (build / routes / core endpoints)
        run: python src/deploy_check.py --url https://teawindow.onrender.com --min-routes 20 --tries 6